<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PPL Flight Deck</title>
<style>
:root{
  --bg:#0d0f12;--panel:#16191d;--panel2:#1e2227;--lane:#0f1114;--card:#22272b;--cardh:#2c333a;
  --line:#2a2f36;--line2:#3a414a;--ink:#eef1f4;--ink2:#c5ccd5;--muted:#8f99a6;
  --s0:#8590a2;--s1:#579dff;--s2:#f5a524;--s3:#4bce97;--s4:#9f8fef;
  --fire:#ff6a1f;--fireLine:#5e2a12;--exam:#ffb43a;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:500 14px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,"Hiragino Sans","Noto Sans JP",sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:var(--panel2);border:1px solid var(--line2);border-radius:8px;padding:7px 12px;font-weight:650;font-size:13px;white-space:nowrap}
button:hover{background:#272c33;border-color:#4b535e}
button:focus-visible,.task:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--s1);outline-offset:2px}
input,select{background:var(--panel2);border:1px solid var(--line2);border-radius:8px;padding:7px 9px;min-width:0}
input[type=date]::-webkit-calendar-picker-indicator{filter:invert(.8)}
.muted{color:var(--muted)}
.section{margin:0;font-size:13px;font-weight:850;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}

.app{display:flex;flex-direction:column;gap:12px;padding:14px 20px 28px;max-width:2100px;margin:0 auto}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;min-height:0;min-width:0}

/* header */
.top{display:flex;justify-content:space-between;align-items:center;gap:14px}
.top>div:first-child{min-width:0}
@media (max-width:1500px){.subtitle [data-t=sub]{display:none}}
.brand{font-size:26px;font-weight:900;letter-spacing:-.6px;line-height:1.05}
.brand span{color:var(--muted);font-weight:700}
.subtitle{font-size:13px;color:var(--muted);font-weight:600;margin-top:4px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.metar{font:700 12px/1 ui-monospace,"SF Mono",Menlo,Consolas,monospace;color:#9fe3c0;background:#0f1a15;border:1px solid #1f3a2d;border-radius:6px;padding:4px 8px;letter-spacing:.04em;white-space:nowrap;cursor:help}
.metar em{font-style:normal;color:var(--muted)}
.kbd{font:700 11px ui-monospace,Menlo,monospace;border:1px solid var(--line2);border-bottom-width:2px;border-radius:5px;padding:1px 5px;color:var(--ink2)}
.tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tools .sep{width:1px;height:24px;background:var(--line2);margin:0 2px}
.demo{color:#ffd08a;background:#3d2b14;border:1px solid #6b4a1c;padding:5px 9px;border-radius:7px;font-size:11px;font-weight:850;letter-spacing:.06em}
.flags{display:flex;gap:2px;padding:3px;background:var(--panel2);border:1px solid var(--line2);border-radius:10px}
.flag{background:transparent;border:0;padding:3px 7px;font-size:20px;line-height:1.2;border-radius:7px;opacity:.5;filter:saturate(.6)}
.flag:hover{opacity:.9;filter:none;background:transparent}
.flag.on{opacity:1;filter:none;background:#343b44}

/* progress */
.progress{padding:14px 20px 12px}
.phead{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.ptotal{font-size:13px;color:var(--muted);font-weight:650}
.track{display:flex;height:48px;border-radius:10px;overflow:hidden;background:#232830;margin:12px 0 10px;gap:2px}
.chunk{position:relative;min-width:0;transition:width .35s ease}
.chunk b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:850;color:#0b0f14;white-space:nowrap;overflow:hidden}
.legend{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.lg{display:flex;gap:9px;align-items:center;padding:4px 6px;border-radius:8px;min-width:0}
.dot{width:12px;height:12px;border-radius:4px;flex:none}
.lg div{min-width:0}
.lg strong{display:block;font-size:13px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lg small{display:block;font-size:12px;color:var(--muted);font-weight:600}

/* center */
.center{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:12px;align-items:stretch}
.cal{padding:12px 14px 10px;display:flex;flex-direction:column;min-height:0}
.calhead{display:flex;align-items:center;margin-bottom:6px;gap:16px}
.calhead .calnav{margin-left:auto}
.calhead .section{font-size:17px;letter-spacing:.02em;text-transform:none;color:var(--ink)}
.calnav{display:flex;gap:4px}.calnav button{padding:4px 11px}
.calgrid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(7,minmax(0,1fr)) 64px;grid-template-rows:auto repeat(var(--weeks,6),minmax(140px,auto));gap:6px}
.wd{text-align:center;font-size:11px;font-weight:850;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding:1px 0 3px}
.wd.wk{color:#ff9e70;z-index:1;padding-top:7px}
.day{display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden;padding:6px 8px;border-radius:8px;background:#1b1f24;border:1px solid #282e35}
.day.out{opacity:.33}
.day.active{background:#e2f8eb;border-color:#7fd8aa;color:#0b3321}
.day.exam{box-shadow:inset 0 0 0 2px var(--exam)}
.dhead{display:flex;align-items:center;gap:5px;min-width:0}
.dnum{font-weight:900;font-size:17px;line-height:1.2;padding:0 2px}
.day.today .dnum{text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:3px}
.dcheck{margin-left:auto;font-size:12px;font-weight:900;color:#138a52}
.examtag{background:var(--exam);color:#2a1800;font-size:9px;font-weight:900;border-radius:4px;padding:1px 4px;letter-spacing:.04em}
.tags{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;gap:2px;margin-top:6px}
.daytag{flex:none;font-size:11.5px;font-weight:800;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left:3px solid var(--k);padding-left:6px;color:#0f3a25}
.daytag.more{border-left-color:transparent;color:#2c5a43;font-weight:850;padding-left:2px}
.day.out .daytag{display:none}
.strip{background:linear-gradient(180deg,#2c150a,#3a1a0b);border:1px solid var(--fireLine);border-radius:32px}
.wcheck{z-index:1;align-self:center;justify-self:center;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;border:2px solid #7a3716;color:#2a1206;font-weight:900;font-size:16px;line-height:1}
.wcheck.on{background:var(--fire);border-color:var(--fire)}
.wcheck.cur{box-shadow:0 0 0 3px #ff6a1f38}
.bubblewrap{z-index:1;display:flex;align-items:center;justify-content:center}
.bubble{width:50px;height:50px;border-radius:50%;background:var(--fire);color:#241006;font-size:24px;font-weight:900;display:grid;place-items:center;box-shadow:0 0 0 4px #ff6a1f22}
.bubblewrap small{font-size:9px;font-weight:850;color:#ffb08a;text-transform:uppercase;letter-spacing:.04em;text-align:center;line-height:1.1;max-width:60px}
.callegend{display:flex;gap:14px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted);font-weight:650;padding:2px}
.callegend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.callegend .hint{color:#ff9e70}
.monthsum{align-self:end;display:flex;gap:22px;align-items:baseline;padding:0 4px 8px;font-size:12px;color:var(--muted);font-weight:650;flex-wrap:wrap}
.monthsum b{font-size:20px;font-weight:900;color:var(--ink);margin-right:5px;letter-spacing:-.3px}
.monthsum .hint{color:#ff9e70;margin-left:auto}

.side{display:flex;flex-direction:column;gap:12px;min-height:0}
.countdown{padding:14px 16px;flex:none}
.cdrow{display:flex;align-items:baseline;gap:8px}
.label{font-size:12px;font-weight:850;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.big{font-size:52px;font-weight:900;letter-spacing:-2px;line-height:1;margin:6px 0 0}
.countdown .unit{font-size:13px;color:var(--ink2);font-weight:700}
.countdown input{width:100%;margin-top:10px}
.next{padding:12px 14px;flex:1;min-height:0;cursor:pointer;position:relative;overflow:hidden;transition:border-color .15s}
.next:hover{border-color:#3d6b55}
.next:before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--s3)}
.nname{font-size:15px;font-weight:850;line-height:1.25;margin:5px 0 4px}
.nwhy{font-size:12px;color:var(--muted);font-weight:650}
.nthen{margin-top:14px;border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:2px}
.nthen .qh{font-size:11px;font-weight:850;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.qrow{display:flex;align-items:center;gap:8px;padding:6px 6px;border-radius:7px;font-size:12.5px;font-weight:700;cursor:pointer}
.qrow:hover{background:#20252b}
.qrow .qn{color:var(--muted);font-size:11px;width:14px;flex:none}
.qrow .qt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qrow .score{font-size:10.5px}
.stats{flex:none;padding:12px 14px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{min-width:0;cursor:help}
.stat+.stat{border-left:1px solid var(--line);padding-left:10px}
.srow{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.sv{font-size:22px;font-weight:900;letter-spacing:-.5px}
.sl{font-size:12px;color:var(--muted);font-weight:650}
.meter{position:relative;height:6px;border-radius:3px;background:#2a3038;margin-top:6px}
.meter i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--s2)}
.meter b{position:absolute;top:-3px;width:2px;height:12px;background:var(--ink)}

/* board */
.board{padding:14px 14px 16px;background:linear-gradient(120deg,#0b5ea8 0%,#0a4f8f 50%,#083d70 100%);border-color:#1a6aa8}
.board .section{color:#fff}.board .section .muted,.board .hint{color:#d6e4f3}.board .kbd{color:#fff;border-color:#9dbbe0}
.boardhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:10px}
.hint{font-size:12px;color:var(--muted);font-weight:600}
.lanes{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;align-items:start}
.lane{background:#101204;border-radius:12px;min-width:0;box-shadow:0 1px 3px #00152a66}
.lane.over{outline:2px dashed #cfe3ff;outline-offset:-3px;background:#15200f}
.lanehead{padding:11px 12px 8px;color:#e8e9e7;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.lname{font-weight:800;font-size:14px;display:flex;align-items:center;gap:8px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lname:before{content:'';flex:none;width:10px;height:10px;border-radius:3px;background:var(--accent)}
.lcount{font-size:12px;color:var(--muted);font-weight:650;white-space:nowrap}
.lanecards{padding:2px 8px 10px;display:flex;flex-direction:column;gap:8px;min-height:44px}
.task{flex:none;background:#22272b;border:1px solid transparent;border-radius:8px;padding:9px 11px;box-shadow:0 1px 1px #0007;cursor:grab;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.task:hover{background:#2c333a;border-color:#4a535d}
.task.dragging{opacity:.3}
.task.flash{animation:flash 1.1s ease}
@keyframes flash{0%{box-shadow:0 0 0 2px var(--s3);background:#2b4a3c}100%{box-shadow:none}}
.chunk b,.sv,.big{transition:color .2s}
.tname{font-weight:700;font-size:13.5px;line-height:1.3;color:#e6e9ed}
.tmeta{display:flex;gap:7px;align-items:center;margin-top:6px;font-size:11px;color:var(--muted);font-weight:650}
.score{padding:1px 6px;border-radius:4px;font-weight:850}
.sc-good{background:#1d4835;color:#7ee2b3}.sc-mid{background:#4a3913;color:#f8c96a}.sc-low{background:#4d2222;color:#ff9c95}.sc-none{background:#2c3138;color:var(--muted)}
.last{margin-left:auto}
.ghost{position:fixed;left:0;top:0;pointer-events:none;z-index:60;transform-origin:center;box-shadow:0 14px 34px #000c;background:var(--cardh)}
body.dragging,body.dragging *{cursor:grabbing!important;user-select:none!important}

/* modal */
.modalbg{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;z-index:40;padding:16px}
.modal{width:min(480px,100%);max-height:calc(100dvh - 32px);overflow:auto;background:#1b1f24;border:1px solid #47505b;border-radius:16px;padding:20px;box-shadow:0 25px 70px #000a}
.mhead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.mhead h3{margin:0 0 4px;font-size:20px;line-height:1.2}
.x{font-size:20px;padding:2px 10px;line-height:1}
.field{display:block;margin-top:14px;min-width:0}
.flabel{display:block;font-size:11px;font-weight:850;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.field select,.field input{width:100%}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;gap:4px;background:var(--lane);padding:4px;border-radius:10px;border:1px solid var(--line)}
.seg button{flex:1;border:0;background:transparent;padding:7px 6px}
.seg button.on{background:#2c333b;box-shadow:inset 0 0 0 1px #4b535e}
.mbtns{display:flex;gap:8px;margin-top:18px}
.primary{background:#23a873;border-color:#23a873;color:#04170e}
.primary:hover{background:#2fbf86;border-color:#2fbf86}
.hist{margin-top:18px;border-top:1px solid var(--line);padding-top:12px}
#mHist{max-height:170px;overflow:auto;font-size:13px}
.hrow{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid #262b31}
.hrow .k{width:8px;height:8px;border-radius:50%;flex:none}
.hrow .ex{font-size:10px;font-weight:850;color:#ffd08a;background:#3d2b14;border-radius:4px;padding:0 5px}
.hrow button{margin-left:auto;padding:1px 8px;font-size:12px}

/* top row: progress + countdown + stats */
.toprow{display:grid;grid-template-columns:minmax(0,1fr) 194px 194px;gap:12px}
.toprow .countdown{display:flex;flex-direction:column;justify-content:center}
.toprow .stats{display:flex;flex-direction:column;justify-content:center;gap:6px;padding:12px 14px}
.toprow .stat{display:flex;align-items:baseline;gap:8px;border:0!important;padding:0!important}
.toprow .stat .sv{font-size:17px;min-width:56px}
.toprow .stats{gap:3px!important;padding:8px 14px!important}
.toprow .stat .sl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toprow{grid-template-columns:minmax(0,1fr) 194px 300px}
.toprow .meter{display:none}
@media (max-width:1180px){.toprow{grid-template-columns:minmax(0,1fr) 170px 240px}}
@media (max-width:860px){.toprow{grid-template-columns:1fr 1fr}.toprow .progress{grid-column:1/-1}}

/* FIT MODE: on large screens the dashboard fits in one window (all cards still visible, no scroll inside lists) */
@media (min-width:1100px) and (min-height:1050px){
  body:not(.srview) .app{height:100dvh;padding:10px 18px 12px;gap:10px}
  #viewDash{flex:1;min-height:0;gap:10px}
  #viewDash .center{flex:1;min-height:260px}
  .subtitle{display:none}
  .progress{padding:10px 16px 8px}.track{height:34px;margin:8px 0 6px}.chunk b{font-size:13px}
  .legend .lg strong{display:inline}.legend .lg small{display:inline;margin-left:6px}.lg{padding:1px 4px}
  .toprow .countdown{padding:8px 14px}.toprow .big{font-size:38px;margin:2px 0 0}.toprow .countdown input{margin-top:6px;padding:4px 8px}
  .board{padding:9px 12px 11px}.boardhead{margin-bottom:7px}
  .lanehead{padding:7px 10px 5px;font-size:13px}.lanecards{padding:2px 6px 7px;gap:4px;min-height:30px}
  .lanes{align-items:stretch}
  .task{display:flex;align-items:center;gap:8px;padding:5px 10px}
  .tname{flex:1;min-width:0;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tmeta{margin-top:0;flex:none}.tmeta .last{min-width:34px;text-align:right}
  .lanecards.multi{display:block;column-gap:6px}
  .lanecards.multi .task{break-inside:avoid;margin-bottom:4px}
  .tmeta .last{display:none}.tmeta{gap:5px}
  .cal{padding:9px 12px 6px;min-height:0}
  .calhead{margin-bottom:4px}
  .calgrid{grid-template-rows:auto repeat(var(--weeks,6),minmax(0,1fr));gap:4px}
  .day{padding:3px 7px}.dnum{font-size:14px}.daytag{font-size:10px;line-height:1.25}.tags{margin-top:2px;gap:1px}
  .wcheck{width:22px;height:22px;font-size:12px}
  .sr{padding:10px 14px;overflow:hidden;gap:4px}
  .sr .chart,.sr .chartlegend,.sr .prevtitle,.sr .prevstats{flex:none}
  .sr .nthen{flex:0 1 auto;min-height:0;overflow:hidden;padding-top:6px}
  .qrow{padding:4px 6px}
}

.ptest{cursor:pointer}.ptest:hover .sl{color:var(--ink)}.addpt{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:4px;background:#2c333b;color:var(--ink);font-size:12px;line-height:1;margin-left:2px}
/* tabs & views */
.brandrow{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.tabs{display:flex;gap:2px;background:var(--panel2);border:1px solid var(--line2);border-radius:10px;padding:3px}
.tabs button{background:transparent;border:0;color:var(--muted);font-weight:750;font-size:13px;padding:6px 12px;border-radius:7px;white-space:nowrap;cursor:pointer}
.tabs button:hover{color:var(--ink);background:#2a3038}
.tabs button.on{background:#343b44;color:var(--ink)}
.view{display:flex;flex-direction:column;gap:12px}
/* spaced repetition side panel */
.sr{padding:14px 16px;flex:1;min-height:0;display:flex;flex-direction:column;gap:6px}
.srtop{display:flex;justify-content:space-between;align-items:center}
.linkbtn{background:transparent;border:0;color:#8fb8ff;padding:2px 0;font-size:12.5px;font-weight:800}
.linkbtn:hover{background:transparent;text-decoration:underline}
.prevtitle{font-size:15px;font-weight:850;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.prevstats{font-size:12px;color:var(--muted);font-weight:650;min-height:16px}
.prevstats b{color:var(--ink);font-weight:850}
.chart svg{display:block;width:100%;height:auto}
.chart .empty{border:1px dashed var(--line2);border-radius:10px;color:var(--muted);font-size:12.5px;font-weight:650;display:grid;place-items:center;text-align:center;padding:16px;min-height:150px}
.cg{stroke:#272c33;stroke-width:1}
.cy,.cx{fill:#8f99a6;font:650 10px system-ui,sans-serif}
.cth{stroke:#f5a524;stroke-width:1;stroke-dasharray:3 4;opacity:.85}
.crep{stroke:#39414b;stroke-width:1}
.ctoday{stroke:#c5ccd5;stroke-width:1;stroke-dasharray:2 3}
.cexam{stroke:var(--exam);stroke-width:1.3}
.s-actual{fill:none;stroke:#579dff;stroke-width:2.2;stroke-linejoin:round}
.s-proj{fill:none;stroke:#579dff;stroke-width:2;stroke-dasharray:5 4;opacity:.7}
.s-ghost{fill:none;stroke:#4bce97;stroke-width:1.4;stroke-dasharray:3 4;opacity:.6}
.s-examline{fill:none;stroke:#eef1f4;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.chartlegend{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);font-weight:650;margin-top:4px}
.chartlegend.small{font-size:10.5px;gap:4px 10px}
.chartlegend i{display:inline-block;width:16px;height:0;border-top:2px solid;margin-right:5px;vertical-align:3px}
.sr .nthen{margin-top:auto;border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:2px}
.qh{font-size:11px;font-weight:850;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.qrow{display:flex;align-items:center;gap:8px;padding:6px 6px;border-radius:7px;font-size:12.5px;font-weight:700;cursor:pointer}
.qrow:hover{background:#20252b}
.qrow .qt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rpill{font-size:10.5px;font-weight:850;padding:1px 6px;border-radius:4px}
.duechip{font-size:11px;font-weight:800;color:var(--muted);white-space:nowrap;min-width:64px;text-align:right}
.duechip.over{color:#ff9c95}.duechip.now{color:#f8c96a}
/* analysis page */

function normalize(o){
  if(!o||typeof o!=='object'||!Array.isArray(o.statuses)||o.statuses.length!==TOPICS.length||!Array.isArray(o.events))return null;
  const ok=s=>/^\d{4}-\d{2}-\d{2}$/.test(s||'');
  const cl=v=>v==null||v===''||!isFinite(v)?null:Math.max(0,Math.min(100,Math.round(+v)));
  return {v:12,
    statuses:o.statuses.map((s,i)=>STATUS.includes(s)?s:TOPICS[i].status),
    scores:Array.isArray(o.scores)&&o.scores.length===TOPICS.length?o.scores.map(cl):TOPICS.map(x=>x.score),
    events:o.events.filter(e=>e&&ok(e.date)&&Number.isInteger(e.topic)&&TOPICS[e.topic]&&['study','review','move'].includes(e.kind))

    lang:I18N[o.lang]?o.lang:'en',

let toastTimer;
function toast(msg,undoFn){
  const n=$('#toast');n.innerHTML=`<span>${esc(msg)}</span>`+(undoFn?`<button type="button">${esc(t('undo'))}</button>`:'');
  if(undoFn)n.querySelector('button').onclick=()=>{n.classList.remove('show');undoFn()};
  n.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>n.classList.remove('show'),undoFn?6000:2300);
}

/* ================= SPACED REPETITION (DEMO MODEL) =================
   R(t) = 1 / (1 + t / (9·S))      recall t days after the last session; S = days until recall falls to 90%
   first session:   S = 1 (score < 70) · 1.5 (70–84) · 2 (≥ 85)
   later session with score p, when recall had fallen to R:
     p ≥ 70  →  S ← S · (1 + 1.2 · p/100 · (1.5 − R))
     60–69   →  S ← S · 1.2
     p < 60  →  S ← max(1, 0.4 · S)
   next review = last session + S days (the moment R reaches 90 %)
   priority = (1 − R_now + 0.05 · min(days overdue, 10)) · √questions · list weight · (1 + max(0, 85 − score)/100)
*/
const SR_LISTS=['Very Comfortable','Not Comfortable','To review'];
const LISTW={'Not Comfortable':1.4,'To review':1.3,'Very Comfortable':1};
const recall=(dt,S)=>1/(1+Math.max(0,dt)/(9*S));
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d)};
function isTracked(i){return SR_LISTS.includes(state.statuses[i])||state.events.some(e=>e.topic===i&&e.kind==='move'&&(e.to==='Very Comfortable'||e.to==='Not Comfortable'))}
function srModel(i){
  const today=todayISO(),by={};
  state.events.forEach(e=>{if(e.topic===i&&(e.kind==='study'||e.kind==='review')&&!e.partial&&e.date<=today)(by[e.date]??=[]).push(e)});
  const reps=[];let S=0,prev=null;
  Object.keys(by).sort().forEach(d=>{
    const sc=by[d].map(e=>e.score).filter(v=>v!=null),p=sc.length?Math.max(...sc):(state.scores[i]??70);
    let Rb=null;
    if(prev==null)S=p>=85?2:p>=70?1.5:1;
    else{Rb=recall(diffDays(prev,d),S);S=p>=70?S*(1+1.2*(p/100)*(1.5-Rb)):p>=60?S*1.2:Math.max(1,.4*S)}
    reps.push({date:d,p,Rb,S});prev=d;
  });
  const m={i,reps,tracked:isTracked(i),R:null,S:null,over:null,p:state.scores[i]};
  if(reps.length){const l=reps[reps.length-1],tn=diffDays(l.date,today),iv=Math.max(1,Math.round(l.S));
    Object.assign(m,{R:recall(tn,l.S),S:l.S,last:l.date,p:l.p,next:addDays(l.date,iv),over:tn-iv})}
  const w=LISTW[state.statuses[i]]||.8,gap=1+Math.max(0,GOAL-(m.p??70))/100;
  m.pr=(reps.length?(1-m.R+.05*Math.min(Math.max(m.over,0),10)):.45)*Math.sqrt(TOPICS[i].q)*w*gap;
  return m;
}
function srAll(){return TOPICS.map((_,i)=>srModel(i)).filter(m=>m.tracked).sort((a,b)=>b.pr-a.pr)}
function dueText(m){if(!m.reps.length)return [t('noHist'),'over'];if(m.over>0)return [tf('dueAgo',m.over),'over'];if(m.over===0)return [t('dueToday'),'now'];return [tf('dueIn',-m.over),'']}
const rcls=R=>R==null?'sc-none':R>=.9?'sc-good':R>=.8?'sc-mid':'sc-low';
const pct=R=>R==null?'—':Math.round(R*100)+'%';
function wavg(ms){let a=0,b=0;ms.forEach(m=>{if(m.R!=null){a+=TOPICS[m.i].q*m.R;b+=TOPICS[m.i].q}});return b?a/b:null}

function chartSVG(o){
  const {w,h,x0,x1,series,ticks=[],todayX,examX}=o;
  const L=36,R=8,T=14,B=22,pw=w-L-R,ph=h-T-B;
  let lo=1;series.forEach(s=>s.pts.forEach(p=>{lo=Math.min(lo,p[1])}));
  const ymin=Math.max(0,Math.min(.6,Math.floor((lo-.04)*10)/10));
  const X=x=>L+(x-x0)/Math.max(1e-6,x1-x0)*pw,Y=v=>T+(1-(v-ymin)/(1-ymin))*ph;
  const f=n=>n.toFixed(1);
  let g='';
  [ymin,(ymin+1)/2,1].forEach(v=>g+=`<line class="cg" x1="${L}" x2="${w-R}" y1="${f(Y(v))}" y2="${f(Y(v))}"/><text class="cy" x="${L-5}" y="${f(Y(v)+3.5)}" text-anchor="end">${Math.round(v*100)}%</text>`);
  g+=`<line class="cth" x1="${L}" x2="${w-R}" y1="${f(Y(.9))}" y2="${f(Y(.9))}"/>`;
  let lastLx=-99;
  ticks.forEach(tk=>{const x=X(tk.x);if(tk.line)g+=`<line class="crep" x1="${f(x)}" x2="${f(x)}" y1="${T}" y2="${T+ph}"/>`;if(x-lastLx>36&&x<w-14){g+=`<text class="cx" x="${f(x)}" y="${h-6}" text-anchor="middle">${esc(tk.label)}</text>`;lastLx=x}});
  if(examX!=null&&examX>=x0&&examX<=x1){const x=X(examX);g+=`<line class="cexam" x1="${f(x)}" x2="${f(x)}" y1="${T}" y2="${T+ph}"/><text class="cx" x="${f(x-3)}" y="${T-3}" text-anchor="end" style="fill:var(--exam)">${esc(t('examShort'))}</text>`}
  if(todayX!=null&&todayX>=x0&&todayX<=x1){const x=X(todayX);g+=`<line class="ctoday" x1="${f(x)}" x2="${f(x)}" y1="${T}" y2="${T+ph}"/><text class="cx" x="${f(x+3)}" y="${T-3}">${esc(t('todayMark'))}</text>`}
  series.forEach(sr=>{if(sr.pts.length>1)g+=`<path class="${sr.cls}" d="${sr.pts.map((p,k)=>(k?'L':'M')+f(X(p[0]))+' '+f(Y(p[1]))).join('')}"/>`});
  return `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(t('tabSR'))}">${g}</svg>`;
}
function topicChart(m,w,h){
  const o=m.reps[0].date,tN=diffDays(o,todayISO()),x1=tN+14,ex=diffDays(o,state.deadline);
  const actual=[],proj=[],ghosts=[],exam=[];
  m.reps.forEach((r,k)=>{
    const t0=diffDays(o,r.date),tEnd=k+1<m.reps.length?diffDays(o,m.reps[k+1].date):x1;
    for(let x=t0;;x=Math.min(x+.25,tEnd)){const p=[x,recall(x-t0,r.S)];if(x<=tN)actual.push(p);if(x>=tN)proj.push(p);if(x>=tEnd)break}
    if(k+1<m.reps.length){const gs=[];for(let x=tEnd;;x=Math.min(x+.5,x1)){gs.push([x,recall(x-t0,r.S)]);if(x>=x1)break}ghosts.push({cls:'s-ghost',pts:gs})}
    if(ex>t0)exam.push([t0,recall(ex-t0,r.S)]);
  });
  if(exam.length&&ex>tN)exam.push([tN,exam[exam.length-1][1]]);
  const ticks=m.reps.map(r=>{const x=diffDays(o,r.date);return {x,line:true,label:tf('dayN',x)}});
  return chartSVG({w,h,x0:-.5,x1,todayX:tN,examX:ex,ticks,series:[...ghosts,{cls:'s-examline',pts:exam},{cls:'s-proj',pts:proj},{cls:'s-actual',pts:actual}]});
}
function avgChart(ms,w,h){
  const live=ms.filter(m=>m.reps.length);if(!live.length)return `<div class="empty">${esc(t('noHistLong'))}</div>`;
  const today=todayISO(),minO=addDays(today,-35);let o=live.map(m=>m.reps[0].date).sort()[0];if(o<minO)o=minO;
  const tN=diffDays(o,today),x1=tN+14,ex=diffDays(o,state.deadline);
  const tp=live.map(m=>({q:TOPICS[m.i].q,r:m.reps.map(r=>({x:diffDays(o,r.date),S:r.S}))}));
  const at=(fn,x)=>{let a=0,b=0;tp.forEach(tq=>{let last=null;for(const r of tq.r){if(r.x<=x)last=r;else break}if(last){a+=tq.q*fn(last,x);b+=tq.q}});return b?a/b:null};
  const act=[],proj=[],exam=[];
  for(let x=0;x<=x1;x+=.25){const v=at((r,xx)=>recall(xx-r.x,r.S),x);if(v==null)continue;if(x<=tN)act.push([x,v]);if(x>=tN)proj.push([x,v]);if(ex>x&&x<=tN&&x%1===0)exam.push([x,at(r=>recall(ex-r.x,r.S),x)])}
  const df=new Intl.DateTimeFormat(LOCALE[lang],{month:'short',day:'numeric'}),ticks=[];
  for(let x=0;x<=x1;x+=7)ticks.push({x,line:true,label:df.format(parse(addDays(o,x)))});
  return chartSVG({w,h,x0:0,x1,todayX:tN,examX:ex,ticks,series:[{cls:'s-examline',pts:exam},{cls:'s-proj',pts:proj},{cls:'s-actual',pts:act}]});
}

/* ===== weekly study volume (questions) =====
   A completed study/review session counts the topic's question count; a completed practice test counts its questions.
   Sessions in progress and card moves count 0. Weeks run Monday–Sunday, like the calendar. */
function weekStart(isoD){const d=parse(isoD);d.setDate(d.getDate()-((d.getDay()+6)%7));return iso(d)}
function weeklyVolume(n){
  const by={};const add=(d,q)=>{const k=weekStart(d);by[k]=(by[k]||0)+q};
  state.events.forEach(e=>{if((e.kind==='study'||e.kind==='review')&&!e.partial)add(e.date,TOPICS[e.topic].q)});
  (state.tests||[]).forEach(x=>{if(x.score!=null)add(x.date,x.q||60)});
  const cur=weekStart(todayISO());let first=cur;
  if(n){first=addDays(cur,-7*(n-1))}else{const ks=Object.keys(by).sort();first=ks.length&&ks[0]<cur?ks[0]:addDays(cur,-7*11);if(diffDays(first,cur)/7<11)first=addDays(cur,-7*11)}
  const out=[];for(let w=first;w<=cur;w=addDays(w,7))out.push({w,q:by[w]||0});return out;
}
function volSVG(data,W,H,big){
  const L=big?8:4,Rp=big?46:4,T=big?16:6,B=big?24:4,pw=W-L-Rp,ph=H-T-B;
  const max=Math.max(1,...data.map(d=>d.q));const nice=big?Math.ceil(max/50)*50||50:max;
  const X=k=>L+(data.length<2?pw/2:k*pw/(data.length-1)),Y=v=>T+ph-(v/nice)*ph,f=n=>n.toFixed(1);
  const pts=data.map((d,k)=>[X(k),Y(d.q)]),line=pts.map((p,k)=>(k?'L':'M')+f(p[0])+' '+f(p[1])).join('');
  let g=`<defs><linearGradient id="vgrad${big?'b':'m'}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fc5200" stop-opacity=".45"/><stop offset="1" stop-color="#fc5200" stop-opacity="0"/></linearGradient></defs>`;
  if(big){[0,.5,1].forEach(r=>{const y=T+ph-r*ph;g+=`<line class="vgrid" x1="${L}" x2="${L+pw}" y1="${f(y)}" y2="${f(y)}"/><text class="vax" x="${W-4}" y="${f(y+3.5)}" text-anchor="end">${fmt(Math.round(nice*r))}</text>`})}
  g+=`<path d="${line}L${f(pts.at(-1)[0])} ${T+ph}L${f(pts[0][0])} ${T+ph}Z" fill="url(#vgrad${big?'b':'m'})"/><path class="vline" d="${line}"/>`;
  const xn=pts.at(-1)[0];g+=`<line class="vnow" x1="${f(xn)}" x2="${f(xn)}" y1="${T}" y2="${T+ph}"/>`;
  const r=big?4.5:(data.length>16?2:3);
  pts.forEach((p,k)=>{const cur=k===pts.length-1;if(cur)g+=`<circle class="vhalo" cx="${f(p[0])}" cy="${f(p[1])}" r="${r*2.6}"/>`;g+=`<circle class="vdot${cur?' cur':''}" cx="${f(p[0])}" cy="${f(p[1])}" r="${r}"><title>${esc(data[k].day?new Intl.DateTimeFormat(LOCALE[lang],{weekday:'short',month:'short',day:'numeric'}).format(parse(data[k].w)):t('weekOf').replace('{d}',new Intl.DateTimeFormat(LOCALE[lang],{month:'short',day:'numeric'}).format(parse(data[k].w))))}: ${data[k].q} ${esc(t('questionsUnit'))}</title></circle>`;
    if(big&&data.length<=14&&data[k].q)g+=`<text class="vval" x="${f(p[0])}" y="${f(p[1]-9)}" text-anchor="middle">${data[k].q}</text>`});
  if(big&&data[0].day){const n=data.length,step=n<=7?1:7,lf=new Intl.DateTimeFormat(LOCALE[lang],n<=7?{weekday:'short'}:{month:'short',day:'numeric'});data.forEach((d,k)=>{if((n-1-k)%step===0)g+=`<text class="vax" x="${f(X(k))}" y="${H-6}" text-anchor="middle">${esc(lf.format(parse(d.w)))}</text>`})}
  else if(big){let lastM=-1;const mf=new Intl.DateTimeFormat(LOCALE[lang],{month:'short'});data.forEach((d,k)=>{const m=parse(d.w).getMonth();if(m!==lastM&&k>0){g+=`<text class="vax" x="${f(X(k))}" y="${H-6}" text-anchor="middle">${esc(mf.format(parse(d.w)).toUpperCase())}</text>`}lastM=m})}
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="${esc(t('volTitle'))}">${g}</svg>`;
}
let volRange='3m';
const RANGES={'3d':{days:3},'7d':{days:7},'1m':{days:30},'3m':{weeks:13},'6m':{weeks:26},'1y':{weeks:52}};
function dailyVolume(){const by={};state.events.forEach(e=>{if((e.kind==='study'||e.kind==='review')&&!e.partial)by[e.date]=(by[e.date]||0)+TOPICS[e.topic].q});(state.tests||[]).forEach(x=>{if(x.score!=null)by[x.date]=(by[x.date]||0)+(x.q||60)});return by}
function rangeSeries(r,shift=0){
  const R=RANGES[r],by=dailyVolume(),today=todayISO();
  if(R.days){const end=addDays(today,-shift*R.days),out=[];for(let k=R.days-1;k>=0;k--){const d=addDays(end,-k);out.push({w:d,q:by[d]||0,day:true})}return out}
  const curW=addDays(weekStart(today),-shift*7*R.weeks),out=[];
  for(let k=R.weeks-1;k>=0;k--){const w=addDays(curW,-7*k);let q=0;for(let i=0;i<7;i++){const d=addDays(w,i);if(d<=today)q+=by[d]||0}out.push({w,q})}
  return out;
}
function renderVolume(){
  const d=weeklyVolume(12),box=$('#volMini');if(!box)return;
  $('#volWeek').textContent=fmt(d.at(-1).q);
  const w=Math.max(120,Math.round(box.clientWidth||240)),h=Math.max(30,Math.round(box.clientHeight||46));
  box.innerHTML=volSVG(d,w,h,false);
  if(!$('#volbg').hidden)renderVolBig();
}
function renderVolBig(){
  const d=rangeSeries(volRange),prev=rangeSeries(volRange,1),box=$('#volBig');
  const tot=d.reduce((a,x)=>a+x.q,0),ptot=prev.reduce((a,x)=>a+x.q,0);
  $('#volTotal').textContent=fmt(tot);
  const df=new Intl.DateTimeFormat(LOCALE[lang],{month:'short',day:'numeric',year:'numeric'});
  const last=d.at(-1).day?d.at(-1).w:(addDays(d.at(-1).w,6)>todayISO()?todayISO():addDays(d.at(-1).w,6));
  $('#volDates').textContent=`${df.format(parse(d[0].w))} – ${df.format(parse(last))}`;
  if(ptot>0){const ch=Math.round((tot-ptot)/ptot*100);$('#volCmp').innerHTML=`<b class="${ch>=0?'up':'down'}">${ch>=0?'▲':'▼'} ${Math.abs(ch)}%</b><br>${esc(t('vsPrior'))}`}
  else $('#volCmp').innerHTML='';
  box.innerHTML=volSVG(d,Math.round(box.clientWidth||700),Math.round(box.clientHeight||280),true);
  document.querySelectorAll('#volRange button').forEach(b=>b.classList.toggle('on',b.dataset.r===volRange));
}

/* ================= BUILT-IN UNIT TESTS =================
   Run: open the file with #selftest at the end of the address, or call selfTest() in the console.
   They test the pure logic on throw-away fixtures and always restore your real data. */
function selfTest(){
  const out=[],ok=(group,name,cond,detail='')=>out.push({group,name,pass:!!cond,detail:String(detail)});
  const near=(a,b,e=1e-3)=>a!=null&&Math.abs(a-b)<e;
  const saved=JSON.stringify(state),savedLang=lang;
  const T=todayISO(),D=n=>addDays(T,-n);
  const fixture=(evs=[],extra={})=>{state={v:13,statuses:TOPICS.map(t=>t.status),scores:TOPICS.map(t=>t.score),events:evs.map(e=>({id:uid(),from:null,to:null,score:null,partial:false,demo:false,...e})),tests:[],deadline:addDays(T,31),lang:'en',updatedAt:0,...extra}};
  const S=(i)=>srModel(i);
  try{
    /* --- forgetting curve --- */
    ok('SR formula','R(0) = 100%',near(recall(0,3),1));
    ok('SR formula','R(t=S) = 90% (definition of stability)',near(recall(4,4),.9),recall(4,4));
    ok('SR formula','R(t) = 1/(1+t/(9S)) for t=2,S=1',near(recall(2,1),1/(1+2/9)),recall(2,1));
    ok('SR formula','recall decreases with time',recall(1,2)>recall(5,2));
    ok('SR formula','higher stability forgets slower',recall(5,6)>recall(5,2));
    /* --- first session bands --- */
    fixture([{date:D(0),topic:22,kind:'study',score:65}]);ok('SR first session','score < 70 → S = 1',near(S(22).S,1),S(22).S);
    fixture([{date:D(0),topic:22,kind:'study',score:75}]);ok('SR first session','score 70–84 → S = 1.5',near(S(22).S,1.5),S(22).S);
    fixture([{date:D(0),topic:22,kind:'study',score:90}]);ok('SR first session','score ≥ 85 → S = 2',near(S(22).S,2),S(22).S);
    fixture([{date:D(0),topic:22,kind:'study',score:70}]);ok('SR first session','boundary 70 → S = 1.5',near(S(22).S,1.5),S(22).S);
    fixture([{date:D(0),topic:22,kind:'study',score:85}]);ok('SR first session','boundary 85 → S = 2',near(S(22).S,2),S(22).S);
    /* --- updates --- */
    fixture([{date:D(4),topic:22,kind:'study',score:80},{date:D(0),topic:22,kind:'review',score:90}]);
    {const R=1/(1+4/(9*1.5)),exp=1.5*(1+1.2*.9*(1.5-R));ok('SR update','good review: S ← S·(1+1.2·p·(1.5−R))',near(S(22).S,exp),`${S(22).S} vs ${exp}`)}
    fixture([{date:D(2),topic:22,kind:'study',score:80},{date:D(0),topic:22,kind:'review',score:65}]);ok('SR update','score 60–69: S ← S × 1.2',near(S(22).S,1.8),S(22).S);
    fixture([{date:D(20),topic:22,kind:'study',score:90},{date:D(15),topic:22,kind:'review',score:95},{date:D(0),topic:22,kind:'review',score:40}]);
    {const R1=1/(1+5/18),S1=2*(1+1.2*.95*(1.5-R1));ok('SR update','lapse (< 60): S ← max(1, 0.4·S)',near(S(22).S,Math.max(1,.4*S1)),`${S(22).S} vs ${Math.max(1,.4*S1)}`)}
    fixture([{date:D(3),topic:22,kind:'study',score:30},{date:D(0),topic:22,kind:'review',score:20}]);ok('SR update','lapse never drops below 1 day',near(S(22).S,1),S(22).S);
    fixture([{date:D(9),topic:22,kind:'study',score:90},{date:D(8),topic:22,kind:'review',score:90}]);const early=S(22).S;
    fixture([{date:D(9),topic:22,kind:'study',score:90},{date:D(4),topic:22,kind:'review',score:90}]);ok('SR update','spacing effect: later review grows S more than early review',S(22).S>early,`${S(22).S} > ${early}`);
    fixture([{date:D(2),topic:22,kind:'study',score:90},{date:D(0),topic:22,kind:'review',score:70}]);const lowP=S(22).S;
    fixture([{date:D(2),topic:22,kind:'study',score:90},{date:D(0),topic:22,kind:'review',score:100}]);ok('SR update','higher score grows S more',S(22).S>lowP);
    /* --- what counts as a session --- */
    fixture([{date:D(0),topic:22,kind:'study',score:50},{date:D(0),topic:22,kind:'review',score:88}]);ok('SR sessions','same day: one session, best score wins',S(22).reps.length===1&&near(S(22).S,2),`${S(22).reps.length} reps, S ${S(22).S}`);
    fixture([{date:D(0),topic:22,kind:'study',partial:true}]);ok('SR sessions','session in progress is ignored',S(22).reps.length===0);
    fixture([{date:D(0),topic:22,kind:'move',from:'Doing',to:'Very Comfortable'}]);ok('SR sessions','moving a card is not a session',S(22).reps.length===0);
    fixture([{date:addDays(T,2),topic:22,kind:'study',score:90}]);ok('SR sessions','future-dated session is ignored',S(22).reps.length===0);
    fixture([{date:D(0),topic:22,kind:'study'}]);state.scores[22]=90;ok('SR sessions','completed session without score uses latest card score',near(S(22).S,2),S(22).S);
    /* --- schedule --- */
    fixture([{date:D(3),topic:22,kind:'study',score:90}]);{const m=S(22);ok('SR schedule','next review = last session + round(S)',m.next===addDays(D(3),2),m.next);ok('SR schedule','overdue days counted',m.over===1,m.over);ok('SR schedule','due text says overdue',dueText(m)[1]==='over')}

    fixture([{date:D(5),topic:0,kind:'move',from:'Todo',to:'Not Comfortable'}]);ok('SR tracking','card that once reached Not Comfortable stays tracked',isTracked(0));
    fixture([{date:D(0),topic:12,kind:'review',score:100}]);{const r=srAll();ok('SR priority','topic never reviewed ranks above one reviewed today at 100%',r.findIndex(m=>m.i===15)<r.findIndex(m=>m.i===12))}
    fixture([{date:D(6),topic:12,kind:'study',score:90},{date:D(6),topic:13,kind:'study',score:90}]);state.statuses[12]='Very Comfortable';state.statuses[13]='Not Comfortable';
    {const r=srAll();ok('SR priority','same recall: Not Comfortable ranks above Very Comfortable',r.findIndex(m=>m.i===13)<r.findIndex(m=>m.i===12))}
    fixture([{date:D(0),topic:12,kind:'study',score:90},{date:D(4),topic:13,kind:'study',score:90}]);{const ms=[srModel(12),srModel(13)],exp=(56*ms[0].R+51*ms[1].R)/107;ok('SR average','average recall is weighted by question count',near(wavg(ms),exp),`${wavg(ms)} vs ${exp}`)}
    /* --- progress bar --- */
    fixture([]);{const c=counts();ok('Progress','column totals add up to 1,058 questions',c.reduce((a,b)=>a+b,0)===1058,c.reduce((a,b)=>a+b,0));
      ok('Progress','Very Comfortable = 457 q with the real board',c[3]===457,c[3]);
      state.statuses=state.statuses.map(()=> 'Very Comfortable');ok('Progress','all cards Very Comfortable → 100%',counts()[3]===1058);
      state.statuses[18]='Todo';ok('Progress','moving Weather (158 q) to To Do moves 158 q',counts()[0]===158&&counts()[3]===900)}
    /* --- streak --- */
    fixture([{date:D(0),topic:1,kind:'study'},{date:D(1),topic:1,kind:'study'},{date:D(2),topic:1,kind:'study'}]);ok('Streak','3 days in a row including today → 3',streakInfo().n===3,streakInfo().n);
    fixture([{date:D(1),topic:1,kind:'study'},{date:D(2),topic:1,kind:'study'}]);ok('Streak','ending yesterday still counts → 2',streakInfo().n===2&&!streakInfo().todayDone);
    fixture([{date:D(0),topic:1,kind:'study'},{date:D(2),topic:1,kind:'study'}]);ok('Streak','a gap breaks the streak → 1',streakInfo().n===1);
    fixture([{date:D(1),topic:1,kind:'study'}],{tests:[{id:'x',date:D(0),q:60,score:80}]});ok('Streak','practice test counts as an active day',streakInfo().n===2&&streakInfo().days===2);
    fixture([{date:D(0),topic:1,kind:'study'},{date:D(0),topic:2,kind:'review'}]);ok('Streak','several actions on one day = 1 day',streakInfo().days===1);
    fixture([]);ok('Streak','no activity → 0',streakInfo().n===0);
    /* --- data validation (backup / import) --- */
    ok('Data','rejects a backup with the wrong number of cards',normalize({statuses:['Todo'],events:[]})===null);
    ok('Data','rejects garbage',normalize('hello')===null&&normalize(null)===null);
    {const n=normalize({statuses:TOPICS.map(()=> 'Weird'),events:[],scores:TOPICS.map(()=>150)});ok('Data','unknown status falls back to the card default',n.statuses[0]===TOPICS[0].status);ok('Data','scores are clamped to 0–100',n.scores[0]===100)}
    {const n=normalize({statuses:TOPICS.map(t=>t.status),events:[{date:'2026-10-01',topic:3,kind:'move',status:'Very Comfortable'},{date:'bad',topic:1,kind:'study'},{date:'2026-10-02',topic:99,kind:'study'},{date:'2026-10-03',topic:1,kind:'study',partial:true,score:77}]});
      ok('Data','old versions’ "status" field becomes the move target',n.events[0].to==='Very Comfortable');ok('Data','events with bad dates or unknown topics are dropped',n.events.length===2,n.events.length);ok('Data','in-progress flag and score are kept',n.events[1].partial===true&&n.events[1].score===77)}
    {const n=normalize({statuses:TOPICS.map(t=>t.status),events:[],tests:[{date:'2026-10-29',q:60,score:80},{date:'nope'}]});ok('Data','practice tests are kept, invalid ones dropped',n.tests.length===1&&n.tests[0].score===80)}
    {const n=normalize({statuses:TOPICS.map(t=>t.status),events:[]});ok('Data','backup without scores uses the original Sporty’s scores',n.scores[0]===TOPICS[0].score)}
    {fixture([{date:D(0),topic:1,kind:'study',score:70}]);const round=normalize(JSON.parse(JSON.stringify(state)));const canon=o=>JSON.stringify(o,(k,v)=>v&&typeof v==='object'&&!Array.isArray(v)?Object.keys(v).sort().reduce((a,x)=>(a[x]=v[x],a),{}):v);ok('Data','save → load round trip keeps everything',canon(round.events)===canon(state.events)&&canon(round.scores)===canon(state.scores)&&canon(round.statuses)===canon(state.statuses)&&round.deadline===state.deadline)}
    /* --- translations --- */
    const keys=Object.keys(I18N.en);
    ['pt','ja'].forEach(L=>{const miss=keys.filter(k=>I18N[L][k]==null);ok('Languages',`${L}: every English label has a translation`,!miss.length,miss.join(', '))});

function showSelfTest(){
  const r=selfTest(),fail=r.filter(x=>!x.pass),groups=[...new Set(r.map(x=>x.group))];
  const box=document.createElement('div');box.id='selftestBox';
  box.innerHTML=`<div class="stpanel"><div class="sthead"><b>${fail.length?'❌':'✅'} ${r.length-fail.length}/${r.length} unit tests passed</b><button type="button" id="stClose">×</button></div>`+
    groups.map(g=>`<h4>${esc(g)}</h4>`+r.filter(x=>x.group===g).map(x=>`<div class="strow ${x.pass?'':'bad'}">${x.pass?'✓':'✗'} ${esc(x.name)}${x.pass?'':` <code>${esc(x.detail)}</code>`}</div>`).join('')).join('')+`</div>`;
  document.body.appendChild(box);$('#stClose').onclick=()=>box.remove();
  console[fail.length?'error':'log'](`selfTest: ${r.length-fail.length}/${r.length} passed`,fail);
  return r;
}


/* ================= CLOUD SYNC (private GitHub Gist) =================
   The token and gist id live only in this browser (separate key) — never in the backup JSON or Save HTML.
   Every save is pushed ~1 s later; on open / focus / back online the newest copy (by updatedAt) wins. */
const SYNC_KEY='ppl-flight-deck-sync',GIST_FILE='ppl-flight-deck.json',GH='https://api.github.com';
let sync=(()=>{try{return JSON.parse(localStorage.getItem(SYNC_KEY))||{}}catch(e){return {}}})();
let syncStatus=sync.token?'idle':'off',syncTimer=null,syncBusy=false,syncAgain=false,lastPull=0;
const syncOn=()=>!!(sync.token&&sync.gistId);
function syncStore(){try{sync.token?localStorage.setItem(SYNC_KEY,JSON.stringify(sync)):localStorage.removeItem(SYNC_KEY)}catch(e){}}
async function gh(path,opt={},tok=sync.token){
  const r=await fetch(GH+path,{...opt,headers:{'Accept':'application/vnd.github+json','Authorization':'Bearer '+tok,...(opt.body?{'Content-Type':'application/json'}:{})}});
  if(!r.ok){const e=new Error('GitHub '+r.status);e.status=r.status;throw e}
  return r.status===204?null:r.json();
}
async function gistState(g){const f=g&&g.files&&g.files[GIST_FILE];if(!f)return null;let txt=f.content;if(f.truncated&&f.raw_url)txt=await (await fetch(f.raw_url)).text();try{return normalize(JSON.parse(txt))}catch(e){return null}}
function setSync(st){syncStatus=st;renderSyncChip()}
function syncErr(e){setSync(e&&e.status===401||e&&e.status===403?'auth':e&&e.status===404?'missing':(!navigator.onLine||e instanceof TypeError)?'offline':'error')}
function adopt(remote){state=remote;lang=state.lang;try{localStorage.setItem(STORE,JSON.stringify(state))}catch(e){}render()}
async function syncPush(){
  if(!syncOn())return;if(syncBusy){syncAgain=true;return}
  clearTimeout(syncTimer);syncTimer=null;syncBusy=true;setSync('busy');
  try{await gh('/gists/'+sync.gistId,{method:'PATCH',body:JSON.stringify({files:{[GIST_FILE]:{content:JSON.stringify(state)}}})});sync.at=Date.now();syncStore();setSync('ok')}
  catch(e){syncErr(e)}
  finally{syncBusy=false;if(syncAgain){syncAgain=false;syncPush()}}
}
async function syncPull(force){
  if(!syncOn()||syncBusy||syncTimer)return;if(!force&&Date.now()-lastPull<8000)return;lastPull=Date.now();setSync('busy');
  try{const remote=await gistState(await gh('/gists/'+sync.gistId));
    if(remote&&remote.updatedAt>state.updatedAt){adopt(remote);sync.at=Date.now();syncStore();setSync('ok');toast(t('syncPulled'))}
    else if(!remote||remote.updatedAt<state.updatedAt){await syncPush()}
    else{sync.at=Date.now();syncStore();setSync('ok')}}
  catch(e){syncErr(e)}
}
function schedulePush(){if(!syncOn())return;clearTimeout(syncTimer);setSync('pending');syncTimer=setTimeout(()=>{syncTimer=null;syncPush()},1000)}
async function syncConnect(token){
  const user=await gh('/user',{},token);                     /* validates the token */
  sync={token,login:user.login};
  let found=null;
  for(let page=1;page<=5&&!found;page++){const list=await gh(`/gists?per_page=100&page=${page}`);found=list.find(g=>g.files&&g.files[GIST_FILE]);if(list.length<100)break}
  if(found){
    sync.gistId=found.id;syncStore();
    /* connecting a device to an existing Gist always DOWNLOADS — a new phone can never overwrite the cloud copy */
    const remote=await gistState(await gh('/gists/'+found.id));
    if(remote){adopt(remote);sync.at=Date.now();syncStore();setSync('ok');return 'pulled'}
    await syncPush();return 'pushed';
  }
  const g=await gh('/gists',{method:'POST',body:JSON.stringify({description:'PPL Flight Deck — study progress (private)',public:false,files:{[GIST_FILE]:{content:JSON.stringify(state)}}})});
  sync.gistId=g.id;sync.at=Date.now();syncStore();setSync('ok');return 'created';
}
function syncDisconnect(){clearTimeout(syncTimer);syncTimer=null;sync={};syncStore();setSync('off');renderSyncDlg()}
function renderSyncChip(){
  const c=$('#syncChip');if(!c)return;
  const map={off:['','syncOff'],idle:['','syncIdle'],ok:['ok','syncOk'],busy:['busy','syncBusy'],pending:['busy','syncBusy'],offline:['warn','syncOffline'],auth:['bad','syncAuth'],missing:['bad','syncMissing'],error:['bad','syncError']};
  const [cls,key]=map[syncStatus]||map.off;c.className='syncchip '+cls;c.querySelector('span').textContent=t(key);
  if(!$('#syncbg').hidden)renderSyncDlg();
}
function renderSyncDlg(){
  const on=syncOn(),df=new Intl.DateTimeFormat(LOCALE[lang],{dateStyle:'medium',timeStyle:'short'});
  $('#syncOffBox').hidden=on;$('#syncOnBox').hidden=!on;
  if(on){$('#syncWho').textContent=t('syncWho').replace('{u}','@'+(sync.login||'?'));
    $('#syncLast').textContent=sync.at?t('syncLast').replace('{d}',df.format(new Date(sync.at))):'';
    $('#syncState').textContent=t(({ok:'syncOk',busy:'syncBusy',pending:'syncBusy',offline:'syncOffline',auth:'syncAuth',missing:'syncMissing',error:'syncError'})[syncStatus]||'syncOk')}
}
function openSync(){$('#syncMsg').textContent='';$('#syncToken').value='';renderSyncDlg();$('#syncbg').hidden=false;(syncOn()?$('#syncNow'):$('#syncToken')).focus()}
const closeSync=()=>{$('#syncbg').hidden=true};
$('#syncChip').onclick=openSync;$('#syncClose').onclick=closeSync;
$('#syncbg').addEventListener('pointerdown',e=>{if(e.target.id==='syncbg')closeSync()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#syncbg').hidden)closeSync()});
$('#syncConnect').onclick=async()=>{
  const tok=$('#syncToken').value.trim();if(!tok){$('#syncMsg').textContent=t('syncNeedToken');return}
  const b=$('#syncConnect');b.disabled=true;$('#syncMsg').textContent=t('syncBusy');
  try{const how=await syncConnect(tok);$('#syncMsg').textContent='';renderSyncDlg();toast(t(how==='pulled'?'syncPulled':how==='created'?'syncCreated':'syncOk'))}
  catch(e){sync={};syncStore();setSync('off');$('#syncMsg').textContent=t(e&&(e.status===401||e.status===403)?'syncAuth':(e instanceof TypeError?'syncOffline':'syncError'))}
  finally{b.disabled=false}
};
$('#syncNow').onclick=()=>syncPull(true);
$('#syncOff').onclick=()=>{if(confirm(t('syncOffConfirm')))syncDisconnect()};
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')syncPull()});
window.addEventListener('focus',()=>syncPull());
window.addEventListener('online',()=>{if(syncTimer||syncStatus==='offline'||syncStatus==='pending')syncPush();else syncPull(true)});
window.addEventListener('offline',()=>{if(syncOn())setSync('offline')});
/* last-second push when the tab closes with an unsent change */
window.addEventListener('pagehide',()=>{if(syncOn()&&(syncTimer||syncStatus==='offline')){try{fetch(GH+'/gists/'+sync.gistId,{method:'PATCH',keepalive:true,headers:{'Accept':'application/vnd.github+json','Authorization':'Bearer '+sync.token,'Content-Type':'application/json'},body:JSON.stringify({files:{[GIST_FILE]:{content:JSON.stringify(state)}}})})}catch(e){}}});

save(false);render();fromHash();
renderSyncChip();if(syncOn())syncPull(true);
try{if((location.hash||'')==='#selftest')showSelfTest()}catch(e){}
window.addEventListener('hashchange',()=>{try{if(location.hash==='#selftest'&&!document.getElementById('selftestBox'))showSelfTest()}catch(e){}});
if(!/Mac|iPhone|iPad/.test(navigator.platform))document.querySelectorAll('.kbd').forEach(k=>{if(k.textContent==='⌘K')k.textContent='Ctrl K'});
setInterval(()=>{const delta=diffDays(todayISO(),state.deadline);renderSide()},60000);
if(loadedFromFile)setTimeout(()=>toast(t('fromFile')),300);
</script>

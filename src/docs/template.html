<html lang="@@HTMLLANG@@">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<style>
/* Layout: a pilot's operating handbook — fixed index on the left (desktop), numbered procedures, screenshots as figures. */
:root {
  --bg: #f6f7f8;
  --paper: #ffffff;
  --ink: #1b2129;
  --ink2: #48525e;
  --muted: #6b7682;
  --line: #dde2e7;
  --accent: #b86e00;        /* taxiway amber */
  --accent-soft: #fff3df;
  --link: #1f5fbf;
  --code-bg: #eef1f4;
  --display: 'Barlow Condensed', 'Arial Narrow', sans-serif;
  --body: 'Source Sans 3', 'Segoe UI', system-ui, 'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101317; --paper: #171b20; --ink: #e8ecf0; --ink2: #b9c2cc; --muted: #8b96a2; --line: #2a3038;
    --accent: #f2a93b; --accent-soft: #2b2112; --link: #8ab4f8; --code-bg: #232931; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101317; --paper: #171b20; --ink: #e8ecf0; --ink2: #b9c2cc; --muted: #8b96a2; --line: #2a3038;
  --accent: #f2a93b; --accent-soft: #2b2112; --link: #8ab4f8; --code-bg: #232931; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 400 17px/1.6 var(--body); }
a { color: var(--link); }
.wrap {
  display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 40px; max-width: 1240px; margin: 0 auto;
  padding-block: 32px 80px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
nav.toc { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 24px); align-self: start; max-height: calc(100vh - 48px); overflow: auto; font-size: 14.5px; }
.toc .brand { font: 700 22px/1.1 var(--display); letter-spacing: .02em; text-transform: uppercase; margin-bottom: 4px; }
.toc .brand span { color: var(--accent); }
.toc .ver { color: var(--muted); font-size: 13px; margin-bottom: 18px; }
.toc ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.toc ol ol { padding-left: 14px; margin: 2px 0 8px; }
.toc a { display: block; color: var(--ink2); text-decoration: none; padding: 3px 8px; border-radius: 6px; }
.toc a:hover, .toc a:focus-visible { background: var(--code-bg); color: var(--ink); outline: none; }
.toc > ol > li > a { font-weight: 700; color: var(--ink); }
main { min-width: 0; }
header.hero { padding-bottom: 24px; border-bottom: 1px solid var(--line); margin-bottom: 8px; }
.eyebrow { font: 600 13px/1 var(--body); letter-spacing: .12em; text-transform: uppercase; color: var(--accent); }
h1 { font: 700 clamp(38px, 6vw, 58px)/1.02 var(--display); text-transform: uppercase; letter-spacing: .01em; margin: 10px 0 12px; text-wrap: balance; }
.lead { font-size: 19px; color: var(--ink2); max-width: 66ch; margin: 0; }
section.chap { padding-top: 40px; scroll-margin-top: 16px; }
h2 { font: 700 34px/1.1 var(--display); text-transform: uppercase; letter-spacing: .02em; margin: 0 0 6px; display: flex; gap: 12px; align-items: baseline; }
h2 .n { color: var(--accent); font-family: var(--mono); font-size: 18px; letter-spacing: 0; }
h3 { font: 700 23px/1.2 var(--display); letter-spacing: .02em; margin: 30px 0 6px; scroll-margin-top: 16px; text-transform: uppercase; }
p, li { max-width: 70ch; }
.chap > p.intro { color: var(--ink2); margin-top: 0; }
ol.steps { counter-reset: s; list-style: none; padding: 0; margin: 12px 0; display: grid; gap: 8px; }
ol.steps > li { counter-increment: s; position: relative; padding-left: 38px; }
ol.steps > li::before {
  content: counter(s); position: absolute; left: 0; top: 2px; width: 24px; height: 24px; border-radius: 50%;
  background: var(--accent-soft); color: var(--accent); font: 700 13px/24px var(--mono); text-align: center;
}
ul { padding-left: 20px; }
figure { margin: 18px 0 22px; }
figure img {
  display: block; max-width: 100%; height: auto; border: 1px solid var(--line); border-radius: 8px; cursor: zoom-in;
  background: #0d0f12;
}
figure.narrow img { max-width: 420px; width: 100%; }
figure.mid img { max-width: 640px; width: 100%; }
figcaption { font-size: 14px; color: var(--muted); margin-top: 6px; }
.row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.row figure { margin: 0; }
kbd, code { font: 500 13.5px var(--mono); background: var(--code-bg); border-radius: 4px; padding: 1px 6px; border: 1px solid var(--line); }
.ui { font-weight: 700; color: var(--ink); }
.note { border-left: 3px solid var(--accent); background: var(--accent-soft); padding: 10px 14px; border-radius: 0 6px 6px 0; margin: 14px 0; max-width: 70ch; font-size: 16px; }
.tbl { overflow-x: auto; margin: 12px 0 18px; }
table { border-collapse: collapse; width: 100%; min-width: 560px; font-size: 15.5px; background: var(--paper); border: 1px solid var(--line); border-radius: 8px; }
th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font: 600 13px var(--body); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); background: var(--code-bg); }
tr:last-child td { border-bottom: 0; }
td:first-child { font-weight: 700; white-space: nowrap; }
.formula { font: 500 14px/1.7 var(--mono); background: var(--code-bg); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; overflow-x: auto; white-space: pre; }
.zoom { position: fixed; inset: 0; background: rgba(8, 10, 13, .88); display: grid; place-items: center; z-index: 20; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); cursor: zoom-out; }
.zoom img { max-width: 100%; max-height: 100%; border-radius: 8px; }
ul.refs li { margin-bottom: 6px; font-size: 15.5px; }
.formula + p, p + .formula { margin-top: 10px; }
.langs { display: flex; gap: 4px; margin: 0 0 16px; flex-wrap: wrap; }
.langs a { font-size: 13px; font-weight: 600; text-decoration: none; color: var(--ink2); border: 1px solid var(--line); border-radius: 6px; padding: 2px 9px; }
.langs a[aria-current] { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
.applink { display: inline-block; font-size: 14px; margin-bottom: 18px; }
:lang(ja) h1, :lang(ja) h2, :lang(ja) h3 { text-transform: none; letter-spacing: 0; }
@media (max-width: 900px) {
  .wrap { grid-template-columns: minmax(0, 1fr); gap: 0; }
  nav.toc { position: static; max-height: none; border-bottom: 1px solid var(--line); padding-bottom: 16px; margin-bottom: 8px; }
  nav.toc ol ol { display: none; }
  nav.toc > ol { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .row { grid-template-columns: minmax(0, 1fr); }
}
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }

</style>
</head>
<body>
@@CONTENT@@
<script>
/* language links keep the section you are reading */
document.querySelectorAll('.langs a').forEach(a => a.addEventListener('click', () => { a.href = a.getAttribute('href').split('#')[0] + location.hash; }));
/* click a screenshot to see it full size; click again or press Esc to close */
(() => {
  let box = null;
  const close = () => { if (box) { box.remove(); box = null; } };
  document.addEventListener('click', e => {
    const img = e.target.closest('figure img');
    if (box) { close(); return; }
    if (!img) return;
    box = document.createElement('div');
    box.className = 'zoom';
    box.setAttribute('role', 'dialog');
    box.setAttribute('aria-label', img.alt);
    const big = document.createElement('img');
    big.src = img.src; big.alt = img.alt;
    box.appendChild(big);
    document.body.appendChild(box);
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') close(); });
})();
</script>
</body>
</html>
